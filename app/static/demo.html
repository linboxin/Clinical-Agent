<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Chart Demo</title>
<script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  /* Reference palette (dataviz skill): categorical slots in fixed order, light + dark steps. */
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --panel: #ffffff; --border: #e4e3df;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --accent: #2a78d6; --grid: #ecebe8;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --panel: #232322; --border: #383835;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #94938b;
      --accent: #3987e5; --grid: #2e2e2c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #232322; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #94938b;
    --accent: #3987e5; --grid: #2e2e2c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); margin: 0 0 16px; }
  #ask, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  #ask { display: grid; gap: 10px; }
  textarea, input, select { width: 100%; font: inherit; color: inherit; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  label { font-size: 12px; color: var(--text-secondary); display: grid; gap: 3px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: inherit;
           border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status { color: var(--text-secondary); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  #chart { min-height: 380px; overflow-x: auto; }
  #chart svg { max-width: 100%; }
  .chart-title { font-weight: 600; margin: 0 0 8px; }
  .side h3 { font-size: 13px; margin: 14px 0 6px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
  .side h3:first-child { margin-top: 0; }
  .cite { border-top: 1px solid var(--border); padding: 8px 0; }
  .cite a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .cite .t { color: var(--text-secondary); font-size: 12px; }
  .ev { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-secondary);
        word-break: break-word; margin-top: 3px; }
  .ev b { color: var(--text-primary); font-weight: 500; }
  ul.notes { margin: 0; padding-left: 18px; color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 500; }
  details summary { cursor: pointer; color: var(--text-secondary); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 360px; overflow: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 0; font-size: 12px; color: var(--text-secondary); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .net-node { cursor: pointer; }
  .net-label { font-size: 11px; fill: var(--text-primary); pointer-events: none;
               paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
  .tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; display: none; z-index: 10; }
</style>
</head>
<body>
<main>
  <h1>Clinical trial question → chart</h1>
  <p class="sub">Renders the service's JSON spec as-is: Vega-Lite for cartesian and pie charts, a force layout for networks. Click any mark to see the trials behind it.</p>

  <form id="ask">
    <textarea id="query" rows="2" required placeholder="e.g. Which countries have the most recruiting trials for breast cancer?"></textarea>
    <div class="fields">
      <label>drug_name<input id="drug_name"></label>
      <label>condition<input id="condition"></label>
      <label>sponsor<input id="sponsor"></label>
      <label>country<input id="country"></label>
      <label>preferred_visualization
        <select id="preferred_visualization">
          <option value="">(automatic)</option>
          <option>bar_chart</option><option>grouped_bar_chart</option><option>stacked_bar_chart</option>
          <option>pie_chart</option><option>time_series</option><option>histogram</option>
          <option>scatter_plot</option><option>network_graph</option>
        </select>
      </label>
      <label>follow-up of run<input id="parent_run_id" placeholder="run_id (optional)"></label>
    </div>
    <div class="row">
      <button class="primary" type="submit">Ask</button>
      <button type="button" id="paste">Render pasted JSON…</button>
      <span class="status" id="status"></span>
    </div>
    <textarea id="json" rows="6" hidden placeholder="Paste a response body (e.g. from examples/*.json), then click the button again"></textarea>
  </form>

  <div class="layout">
    <section class="panel">
      <p class="chart-title" id="title"></p>
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel side" id="side">
      <h3>Interpretation</h3><p class="status">Ask a question to begin.</p>
    </aside>
  </div>
  <div class="tip" id="tip"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const palette = () => [1, 2, 3, 4, 5, 6, 7, 8].map((i) => css(`--s${i}`));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let current = null;

$("ask").addEventListener("submit", async (event) => {
  event.preventDefault();
  const body = { query: $("query").value, citations_per_datum: 5 };
  for (const k of ["drug_name", "condition", "sponsor", "country", "preferred_visualization", "parent_run_id"]) {
    if ($(k).value.trim()) body[k] = $(k).value.trim();
  }
  $("status").textContent = "Running… (planning, fetching from ClinicalTrials.gov)";
  try {
    const r = await fetch("/v1/visualizations", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const json = await r.json();
    if (!r.ok && !json.status) throw new Error(JSON.stringify(json.detail ?? json));
    show(json);
  } catch (err) { $("status").textContent = "Error: " + err.message; }
});

$("paste").addEventListener("click", () => {
  const box = $("json");
  if (box.hidden) { box.hidden = false; box.focus(); return; }
  try { const parsed = JSON.parse(box.value); show(parsed.response ?? parsed); } catch (err) { $("status").textContent = "Invalid JSON: " + err.message; }
});

function show(resp) {
  current = resp;
  const meta = resp.meta || {};
  $("status").textContent = `status=${resp.status} · run ${resp.run_id ?? "—"} · ${Object.entries(meta.timings_ms || {}).map(([k, v]) => `${k} ${v}ms`).join(", ")}`;
  if (resp.run_id) $("parent_run_id").placeholder = resp.run_id;
  $("chart").innerHTML = ""; $("legend").innerHTML = "";
  const viz = resp.visualization;
  $("title").textContent = viz ? viz.title : (resp.clarification ? "Needs clarification" : (resp.error?.message ?? ""));
  if (resp.clarification) {
    $("chart").innerHTML = `<p>${esc(resp.clarification.question)}</p><ul class="notes">${resp.clarification.options.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
  } else if (resp.error) {
    $("chart").innerHTML = `<p>${esc(resp.error.code)}: ${esc(resp.error.message)}</p><ul class="notes">${(resp.error.details || []).map((o) => `<li>${esc(o)}</li>`).join("")}</ul>`;
  } else if (viz?.type === "network_graph") {
    drawNetwork(viz);
  } else if (viz) {
    drawVega(viz);
  }
  renderSide(resp, null);
}

/* ---- Spec → Vega-Lite. Uses only documented fields: type, encoding channels, data. ---- */
function channel(ch, extra = {}) {
  const out = { field: ch.field, type: ch.type, title: ch.unit && !ch.title.toLowerCase().includes(ch.unit.toLowerCase()) ? `${ch.title} (${ch.unit})` : ch.title, ...extra };
  if (Array.isArray(ch.sort)) out.sort = ch.sort;
  else if (ch.sort === "ascending" || ch.sort === "descending") out.sort = ch.sort;
  return out;
}

function drawVega(viz) {
  const enc = viz.encoding;
  const colors = palette();
  let data = viz.data.map((d) => ({ ...d }));
  let spec = { mark: { type: "bar", cornerRadiusEnd: 4, tooltip: true }, encoding: {} };
  const series = enc.series ? channel(enc.series, { scale: { range: colors } }) : null;
  const horizontal = viz.orientation === "horizontal";
  const place = (cat, val) => horizontal ? { y: cat, x: val } : { x: cat, y: val };

  if (viz.type === "pie_chart") {
    spec = { mark: { type: "arc", innerRadius: 60, stroke: css("--surface"), strokeWidth: 2, tooltip: true },
             encoding: { theta: channel(viz.encoding.theta), color: channel(viz.encoding.color, { scale: { range: colors } }) } };
  } else if (viz.type === "time_series") {
    // time_granularity=year: x values are integer years; build a date for the temporal axis.
    data = data.map((d) => ({ ...d, _date: `${d[enc.x.field]}-01-01` }));
    spec = { layer: [
      { mark: { type: "line", strokeWidth: 2 } },
      { mark: { type: "point", filled: true, size: 64, tooltip: true } },
    ], encoding: { x: { field: "_date", type: "temporal", timeUnit: "utcyear", title: enc.x.title,
                        axis: { format: "%Y", formatType: "utc" } },
                   y: channel(enc.y), ...(series ? { color: series } : { color: { value: colors[0] } }) } };
  } else if (viz.type === "scatter_plot") {
    const y = channel(enc.y, { scale: { type: "symlog" } }); // enrollment is heavy-tailed
    spec = { mark: { type: "point", filled: true, size: 64, opacity: 0.75, stroke: css("--surface"), strokeWidth: 1, tooltip: true },
             encoding: { x: channel(enc.x), y, ...(series ? { color: series } : { color: { value: colors[0] } }) } };
  } else {
    const cat = channel(enc.x, { axis: { labelLimit: 220 } });
    spec.encoding = { ...place(cat, channel(enc.y)) };
    if (series) {
      spec.encoding.color = series;
      if (viz.type === "grouped_bar_chart" || (viz.type === "histogram" && enc.series)) {
        spec.encoding[horizontal ? "yOffset" : "xOffset"] = { field: enc.series.field, sort: enc.series.sort };
      }
    } else {
      spec.encoding.color = { value: colors[0] };
    }
  }
  const full = {
    $schema: "https://vega.github.io/schema/vega-lite/v5.json",
    width: Math.max(320, $("chart").clientWidth - (series ? 170 : 70)),
    height: horizontal ? Math.max(260, new Set(data.map((d) => d[enc.x.field])).size * 22) : 360,
    data: { values: data }, ...spec,
    config: {
      background: null, view: { stroke: null },
      axis: { labelColor: css("--text-secondary"), titleColor: css("--text-secondary"), gridColor: css("--grid"), domainColor: css("--border"), tickColor: css("--border") },
      legend: { labelColor: css("--text-secondary"), titleColor: css("--text-secondary") },
      bar: { stroke: css("--surface"), strokeWidth: 1 },
    },
  };
  vegaEmbed("#chart", full, { actions: false, renderer: "svg" }).then(({ view }) => {
    view.addEventListener("click", (_e, item) => { if (item?.datum?.datum_id) renderSide(current, item.datum); });
  });
}

/* ---- Network: force layout; node size = trials, edge width = shared trials. ---- */
function drawNetwork(viz) {
  const colors = palette();
  const width = $("chart").clientWidth || 760, height = 520;
  const nodes = viz.data.nodes.map((n) => ({ ...n }));
  const links = viz.data.edges.map((e) => ({ ...e }));
  const groups = [...new Set(nodes.map((n) => n[viz.encoding.nodes.group]))];
  const color = (g) => colors[groups.indexOf(g) % colors.length];
  const maxN = d3.max(nodes, (n) => n.trial_count) || 1, maxE = d3.max(links, (e) => e.trial_count) || 1;
  const svg = d3.select("#chart").append("svg").attr("viewBox", [0, 0, width, height]).attr("width", "100%");
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((n) => n.id).distance(110))
    .force("charge", d3.forceManyBody().strength(-420))
    .force("x", d3.forceX(width / 2).strength(0.06)).force("y", d3.forceY(height / 2).strength(0.08))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius((n) => 6 + 18 * Math.sqrt(n.trial_count / maxN)));
  const link = svg.append("g").attr("stroke", css("--text-muted")).attr("stroke-opacity", 0.45)
    .selectAll("line").data(links).join("line").attr("stroke-width", (e) => 1 + 5 * e.trial_count / maxE)
    .style("cursor", "pointer").on("click", (_e, d) => renderSide(current, d)).on("mousemove", tip).on("mouseleave", hideTip);
  const node = svg.append("g").selectAll("circle").data(nodes).join("circle").attr("class", "net-node")
    .attr("r", (n) => 5 + 16 * Math.sqrt(n.trial_count / maxN)).attr("fill", (n) => color(n[viz.encoding.nodes.group]))
    .attr("stroke", css("--surface")).attr("stroke-width", 2)
    .on("click", (_e, d) => renderSide(current, d)).on("mousemove", tip).on("mouseleave", hideTip)
    .call(d3.drag().on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                   .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                   .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  // Selective direct labels: the 10 largest nodes; hover/click reveals the rest.
  const labelled = new Set([...nodes].sort((a, b) => b.trial_count - a.trial_count).slice(0, 10).map((n) => n.id));
  const labels = svg.append("g").selectAll("text").data(nodes.filter((n) => labelled.has(n.id)))
    .join("text").attr("class", "net-label").text((n) => n.label.length > 28 ? n.label.slice(0, 27) + "…" : n.label);
  sim.on("tick", () => {
    nodes.forEach((n) => { n.x = Math.max(20, Math.min(width - 20, n.x)); n.y = Math.max(20, Math.min(height - 20, n.y)); });
    link.attr("x1", (e) => e.source.x).attr("y1", (e) => e.source.y).attr("x2", (e) => e.target.x).attr("y2", (e) => e.target.y);
    node.attr("cx", (n) => n.x).attr("cy", (n) => n.y);
    labels.attr("x", (n) => n.x + 9).attr("y", (n) => n.y + 4);
  });
  $("legend").innerHTML = groups.map((g) => `<span><i style="background:${color(g)}"></i>${esc(g)}</span>`).join("") +
    `<span>· node size = trials · edge width = shared trials (${esc(links[0]?.relation ?? "")})</span>`;
}
function tip(event, d) {
  const t = $("tip");
  const name = d.label ?? `${d.source.label ?? d.source} — ${d.target.label ?? d.target}`;
  t.innerHTML = `<b>${esc(name)}</b><br>${d.trial_count} trial(s)`;
  t.style.display = "block"; t.style.left = event.clientX + 12 + "px"; t.style.top = event.clientY + 12 + "px";
}
function hideTip() { $("tip").style.display = "none"; }

/* ---- Side panel: citations for the clicked datum + interpretation and coverage. ---- */
function renderSide(resp, datum) {
  const meta = resp.meta || {};
  let html = "";
  if (datum) {
    html += `<h3>Evidence for ${esc(datum.datum_id)} — ${datum.trial_count} trial(s)</h3>`;
    html += (datum.citations || []).map(citeHtml).join("") || `<p class="status">No inline citations.</p>`;
    if (datum.citations_truncated && resp.run_id) {
      html += `<button type="button" id="more">Load all ${datum.citation_count} citations</button>`;
    }
  }
  const interp = meta.interpretation;
  html += `<h3>Interpretation</h3><p>${esc(interp?.summary ?? "—")}</p>`;
  if (meta.chart_selection) html += `<p class="status">Chart: ${esc(meta.chart_selection)}</p>`;
  if (interp?.repair_feedback?.length) html += `<p class="status">Planner repaired: ${esc(interp.repair_feedback.join(" "))}</p>`;
  if (meta.assumptions?.length) html += `<h3>Assumptions</h3><ul class="notes">${meta.assumptions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>`;
  if (meta.cohorts?.length) {
    html += `<h3>Coverage</h3><table><tr><th>Cohort</th><th>API matches</th><th>Analyzed</th><th>Complete</th></tr>` +
      meta.cohorts.map((c) => `<tr><td>${esc(c.label)}</td><td>${c.total_matches}</td><td>${c.trials_analyzed}</td><td>${c.complete ? "yes" : "no"}</td></tr>`).join("") + `</table>`;
  }
  if (meta.truncation) html += `<p class="status">Shown ${meta.truncation.shown} of ${meta.truncation.total}: ${esc(meta.truncation.rule)}</p>`;
  if (meta.policies) html += `<details><summary>Counting policies</summary><ul class="notes">${Object.entries(meta.policies).map(([k, v]) => `<li><b>${esc(k)}</b>: ${esc(v)}</li>`).join("")}</ul></details>`;
  html += `<details><summary>Raw response JSON</summary><pre>${esc(JSON.stringify(resp, null, 2).slice(0, 20000))}</pre></details>`;
  $("side").innerHTML = html;
  const more = $("more");
  if (more) more.addEventListener("click", async () => {
    const r = await fetch(`/v1/runs/${resp.run_id}/evidence?datum_id=${datum.datum_id}&limit=1000`);
    const ev = await r.json();
    more.outerHTML = (ev.citations || []).slice((datum.citations || []).length).map(citeHtml).join("");
  });
}
function citeHtml(c) {
  const ev = (c.evidence || []).map((e) => `<div class="ev">${esc(e.field_path)} = <b>${esc(typeof e.excerpt === "string" ? e.excerpt : JSON.stringify(e.excerpt))}</b></div>`).join("");
  return `<div class="cite"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.nct_id)}</a> <span class="t">${esc(c.brief_title)}</span>${ev}</div>`;
}

const run = new URLSearchParams(location.search).get("run");
if (run) fetch(`/v1/runs/${run}`).then((r) => r.json()).then(show);
</script>
</body>
</html>

  request: {query: "What is the distribution of enrollment sizes for recruiting Alzheimer's trials?"}
  expect:
    status: accepted
    plan: {operation.kind: histogram, operation.measure: enrollment,
           "cohorts[*].filters.overall_status": [RECRUITING]}

- id: hist_duration
  class: histogram
  request: {query: "How long do phase 2 glioblastoma trials take to reach primary completion?"}
  expect:
    status: accepted
    plan: {operation.kind: histogram, operation.measure: duration_months,
           "cohorts[*].filters.trial_phase": [PHASE2]}

- id: scatter_enrollment_start
  class: scatter
  request: {query: "Plot enrollment against start date for phase 3 psoriasis trials"}
  expect:
    status: accepted
    plan: {operation.kind: scatter, operation.measure: enrollment, operation.x_measure: start_date}

# --- structured fields / preferences -----------------------------------------------------------
- id: fields_override
  class: structured_fields
  request: {query: "Which phases are these trials in?", drug_name: Keytruda, overall_status: RECRUITING}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: phase,
           "cohorts[*].filters.drug_name": keytruda, "cohorts[*].filters.overall_status": [RECRUITING]}

- id: preferred_pie
  class: structured_fields
  request: {query: "Show the recruitment status of lung cancer trials as a pie chart",

# Planner eval set: question → expected plan fields. Scored deterministically (evals/scoring.py).
#
# expect.status: accepted | clarification | unsupported | too_broad (or a list of allowed ones)
# expect.plan keys are paths into the accepted QueryPlan:
#   operation.kind              exact path (strings: case-insensitive token match)
#   cohorts[*].filters.X        every cohort has this value
#   cohorts[].filters.X         set of values across cohorts (order-free)
#   cohorts.length              number of cohorts
#   network_nodes               {dimension, second_dimension} as a set (order-free)
# Lists compare as sets. Only listed fields are scored; everything else is free.

# --- time trends -------------------------------------------------------------------------------
- id: trend_brief_example
  class: time_trend
  request: {query: "How has the number of trials for this drug changed over time?", drug_name: Pembrolizumab}
  expect:
    status: accepted
    plan: {operation.kind: time_trend, operation.second_dimension: null, time.date_basis: start_date,
           cohorts.length: 1, "cohorts[*].filters.drug_name": pembrolizumab}

- id: trend_since_year
  class: time_trend
  request: {query: "How has the number of trials for nivolumab changed per year since 2015?"}
  expect:
    status: accepted
    plan: {operation.kind: time_trend, time.year_from: 2015, time.year_to: null,
           "cohorts[*].filters.drug_name": nivolumab}

- id: trend_condition_starts
  class: time_trend
  request: {query: "How many trials started each year for type 2 diabetes?"}
  expect:
    status: accepted
    plan: {operation.kind: time_trend, time.date_basis: start_date,
           "cohorts[*].filters.condition": type 2 diabetes}

- id: trend_completion_basis
  class: time_trend
  request: {query: "How many Alzheimer's disease trials completed each year between 2010 and 2020?"}
  expect:
    status: accepted
    plan: {operation.kind: time_trend, time.date_basis: completion_date, time.year_from: 2010,
           time.year_to: 2020, "cohorts[*].filters.condition": alzheimer}

- id: trend_split_phase
  class: time_trend
  request: {query: "How has the phase mix of obesity trials changed since 2010?"}
  expect:
    status: accepted
    plan: {operation.kind: time_trend, operation.second_dimension: phase, time.year_from: 2010,
           "cohorts[*].filters.condition": obesity}

# --- distributions -----------------------------------------------------------------------------
- id: dist_phase
  class: distribution
  request: {query: "How are breast cancer trials distributed across phases?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: phase, cohorts.length: 1,
           "cohorts[*].filters.condition": breast cancer}

- id: dist_intervention_type
  class: distribution
  request: {query: "What are the most common intervention types for melanoma trials?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: intervention_type,
           "cohorts[*].filters.condition": melanoma}

- id: dist_top_drugs
  class: distribution
  request: {query: "What are the 10 most common drugs tested in multiple myeloma trials?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: drug, top_n: 10,
           "cohorts[*].filters.condition": multiple myeloma}

- id: dist_allocation
  class: distribution
  request: {query: "What share of COVID-19 vaccine trials are randomized?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: allocation}

- id: dist_sponsor_class_recruiting
  class: distribution
  request: {query: "Break down recruiting lung cancer trials by sponsor category"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: sponsor_class,
           "cohorts[*].filters.overall_status": [RECRUITING], "cohorts[*].filters.condition": lung cancer}

- id: dist_top_sponsors
  class: distribution
  request: {query: "Who are the top 15 lead sponsors of psoriasis trials?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: lead_sponsor, top_n: 15}

# --- comparisons -------------------------------------------------------------------------------
- id: cmp_two_drugs
  class: comparison
  request: {query: "Compare phases for trials involving pembrolizumab vs nivolumab."}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: phase, cohorts.length: 2,
           "cohorts[].filters.drug_name": [pembrolizumab, nivolumab]}

- id: cmp_two_conditions_sponsor_class
  class: comparison
  request: {query: "Compare sponsor categories across breast cancer and prostate cancer trials"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: sponsor_class, cohorts.length: 2,
           "cohorts[].filters.condition": [breast cancer, prostate cancer]}

- id: cmp_trend_two_drugs
  class: comparison
  request: {query: "Compare how many semaglutide and tirzepatide trials started each year since 2018"}
  expect:
    status: accepted
    plan: {operation.kind: time_trend, cohorts.length: 2, time.year_from: 2018,
           "cohorts[].filters.drug_name": [semaglutide, tirzepatide]}

# --- geographic --------------------------------------------------------------------------------
- id: geo_recruiting_countries
  class: geographic
  request: {query: "Which countries have the most recruiting trials for breast cancer?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: country,
           "cohorts[*].filters.overall_status": [RECRUITING], "cohorts[*].filters.condition": breast cancer}

- id: geo_sites_in_country
  class: geographic
  request: {query: "Which sites in Germany run the most Parkinson's disease trials?"}
  expect:
    status: accepted
    plan: {operation.kind: count_by, operation.dimension: site,
           "cohorts[*].filters.country": germany, "cohorts[*].filters.condition": parkinson}

# --- networks ----------------------------------------------------------------------------------
- id: net_sponsor_drug
  class: network
  request: {query: "Show a network of sponsors and drugs for phase 3 melanoma trials."}
  expect:
    status: accepted
    plan: {operation.kind: network, network_nodes: [lead_sponsor, drug],
           "cohorts[*].filters.trial_phase": [PHASE3], "cohorts[*].filters.condition": melanoma}

- id: net_drug_cooccurrence
  class: network
  request: {query: "Which drugs frequently co-occur in combination studies for multiple myeloma?"}
  expect:
    status: accepted
    plan: {operation.kind: network, network_nodes: [drug], cohorts.length: 1}

- id: net_investigator_site
  class: network
  request: {query: "Map which investigators work at which sites for recruiting glioblastoma trials"}
  expect:
    status: accepted
    plan: {operation.kind: network, network_nodes: [investigator, site],
           "cohorts[*].filters.overall_status": [RECRUITING]}

- id: net_condition_drug
  class: network
  request: {query: "Show a network of conditions and drugs in metformin trials"}
  expect:
    status: accepted
    plan: {operation.kind: network, network_nodes: [condition, drug],
           "cohorts[*].filters.drug_name": metformin}

# --- histogram / scatter -----------------------------------------------------------------------
- id: hist_enrollment
